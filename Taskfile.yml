version: '3'

tasks:
  # run server
  run:
    dotenv: ['.env']
    cmds:
      - gunicorn app:app -b 0.0.0.0:$PORT --reload

  build:
    cmds:
      - docker build -f Dockerfile -t namhq1989/worddrop-nlp:latest -t namhq1989/worddrop-nlp:$(git rev-parse --short HEAD) .
      - docker push namhq1989/worddrop-nlp:latest
      - docker push namhq1989/worddrop-nlp:$(git rev-parse --short HEAD)
